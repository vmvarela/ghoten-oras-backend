"type:feature":
  - changed-files:
      - any-glob-to-any-file:
          - backend/**

"type:bug":
  - changed-files:
      - any-glob-to-any-file:
          - "**/*_test.go"

"type:docs":
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.md"
          - LICENSE*
          - examples/**

"type:chore":
  - changed-files:
      - any-glob-to-any-file:
          - .github/**
          - go.mod
          - go.sum
