name: Test

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run unit tests
        run: go test -race -count=1 -timeout 10m ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Tidy modules
        run: go mod tidy

      - name: Upload tidied module files
        uses: actions/upload-artifact@v6
        with:
          name: tidied-modules
          path: |
            go.mod
            go.sum

      - name: Check go.mod tidiness
        run: |
          if [[ -n "$(git status --porcelain go.mod go.sum)" ]]; then
            git diff -- go.mod go.sum
            echo "ERROR: go.mod/go.sum are not up-to-date. Run 'go mod tidy' and commit."
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

  zot-integration:
    name: Integration Test (Zot)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run Zot integration tests
        env:
          TF_ORAS_ZOT_TEST: "1"
        run: go test -race -v -timeout 120s ./state/... -run Zot

  ghcr-integration:
    name: Integration Test (GHCR)
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run GHCR integration tests
        env:
          TF_ORAS_GHCR_TEST: "1"
          TF_ORAS_GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: go test -race -v -timeout 300s ./state/... -run 'TestGHCRIntegration'
